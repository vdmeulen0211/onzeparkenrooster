<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>OnzeParkenRooster</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f7fb;
  margin: 0;
  padding: 20px;
  color: #253238;
}

h1 {
  color: #167b65;
  text-align: center;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  margin-bottom: 30px;
}

.kaart {
  background: white;
  padding: 24px;
  border-radius: 16px;
  max-width: 600px;
  margin: 20px auto;
  box-shadow: 0 3px 15px #00000010;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
}

input, select {
  border: 1px solid #ccc;
  background: white;
}

button {
  background: #167b65;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}

.dienst {
  padding: 14px;
  border-bottom: 1px solid #ddd;
  line-height: 1.6;
}

.status {
  background: #edf5f0;
  padding: 12px;
  border-radius: 8px;
  margin: 15px 0;
}

#melding {
  color: #a33524;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #777;
  margin: 40px auto 20px;
  font-size: 13px;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<h1>🎡 Onze FamilieParken</h1>
<p class="subtitle">Personeelsplanning</p>

<section class="kaart" id="login">
  <h2>Inloggen</h2>

  <form id="loginForm">
    <input
      id="email"
      type="email"
      placeholder="E-mailadres"
      autocomplete="username"
      required>

    <input
      id="password"
      type="password"
      placeholder="Wachtwoord"
      autocomplete="current-password"
      required>

    <button type="submit">
      Inloggen
    </button>
  </form>
  <p id="loginMelding" role="status"></p>
</section>

<section class="kaart" id="dashboard" hidden>
  <h2 id="welkom">Welkom</h2>
  <p id="rol"></p>

  <button id="logout">
    Uitloggen
  </button>
</section>

<section class="kaart" id="planner" hidden>

  <h2>📅 Weekrooster</h2>

  <label>Kies een week</label>
  <input type="date" id="datum">

  <h3 id="weekTitel"></h3>

  <p class="status" id="status"></p>

  <button id="maakWeek" hidden>
    Conceptweek aanmaken
  </button>

  <div id="formulier" hidden>

    <h3>Nieuwe dienst toevoegen</h3>

    <form id="dienstForm">

      <label>Medewerker</label>
      <select id="medewerker" required></select>

      <label>Datum</label>
      <input type="date" id="werkdag" required>

      <label>Begintijd</label>
      <input
        type="time"
        id="begin"
        value="09:00"
        required>

      <label>Eindtijd</label>
      <input
        type="time"
        id="eind"
        value="17:00"
        required>

      <label>Pauze (minuten)</label>
      <input
        type="number"
        id="pauze"
        value="30"
        min="0"
        required>

      <button type="submit">
        Dienst opslaan
      </button>

    </form>
  </div>

  <h3>Ingeplande diensten</h3>

  <div id="diensten"></div>

  <p id="melding" role="status"></p>

  <p>
    Weekroosters publiceren en e-mailmeldingen
    worden in de volgende versie toegevoegd.
  </p>

</section>

<section class="kaart" id="werknemer" hidden>
  <h2>Mijn rooster</h2>
  <p>
    Je persoonlijke rooster wordt
    binnenkort toegevoegd.
  </p>
</section>

<footer>Versie 1.2.0</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL =
  "https://tvghmaltprpseimlzcbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M3FAfJg4lb4D6wVvVsrL-g_iAxB80nI";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

let weekId = null;
let namen = {};

function datumTekst(d) {
  return (
    d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );
}

function verschuif(datum, dagen) {
  const d = new Date(datum + "T12:00:00");
  d.setDate(d.getDate() + dagen);
  return datumTekst(d);
}

function maandag(datum) {
  const d = new Date(datum + "T12:00:00");
  d.setDate(
    d.getDate() - ((d.getDay() + 6) % 7)
  );
  return datumTekst(d);
}

function bericht(tekst) {
  el("melding").textContent = tekst;
}

async function laadWeek() {
  weekId = null;

  el("formulier").hidden = true;
  el("maakWeek").hidden = true;
  el("diensten").replaceChildren();
  bericht("");

  const start = maandag(el("datum").value);
  const einde = verschuif(start, 6);

  el("weekTitel").textContent =
    start + " t/m " + einde;

  el("werkdag").min = start;
  el("werkdag").max = einde;
  el("werkdag").value = start;

  const { data, error } = await db
    .from("roosterweken")
    .select("id,status")
    .eq("week_start", start)
    .maybeSingle();

  if (error) {
    bericht(error.message);
    return;
  }

  if (!data) {
    el("status").textContent =
      "Nog geen roosterweek aangemaakt.";

    el("maakWeek").hidden = false;
    return;
  }

  weekId = data.id;

  el("status").textContent =
    "Status: " + data.status;

  el("formulier").hidden =
    data.status !== "concept";

  const resultaat = await db
    .from("diensten")
    .select(
      "medewerker_id,begint_op,eindigt_op,pauze_minuten"
    )
    .eq("roosterweek_id", weekId)
    .order("begint_op");

  if (resultaat.error) {
    bericht(resultaat.error.message);
    return;
  }

  if (resultaat.data.length === 0) {
    el("diensten").textContent =
      "Nog geen diensten ingepland.";
    return;
  }

  for (const dienst of resultaat.data) {
    const regel = document.createElement("div");
    regel.className = "dienst";

    const starttijd =
      new Date(dienst.begint_op);

    const eindtijd =
      new Date(dienst.eindigt_op);

    const tijd = t =>
      t.toLocaleTimeString("nl-NL", {
        hour: "2-digit",
        minute: "2-digit"
      });

    regel.textContent =
      (namen[dienst.medewerker_id] ||
       "Medewerker") +
      " — " +
      starttijd.toLocaleDateString("nl-NL") +
      " | " + tijd(starttijd) +
      " - " + tijd(eindtijd) +
      " | Pauze: " +
      dienst.pauze_minuten + " minuten";

    el("diensten").appendChild(regel);
  }
}

async function toonDashboard() {
  const { data: { user }, error: authError } =
    await db.auth.getUser();

  if (authError || !user) {
    el("login").hidden = false;
    el("dashboard").hidden = true;
    el("planner").hidden = true;
    el("werknemer").hidden = true;
    return;
  }

  const { data: profiel, error } = await db
    .from("profielen")
    .select("naam,rol")
    .eq("id", user.id)
    .single();

  if (error || !profiel) {
    throw new Error("Geen geldig profiel gevonden.");
  }

  el("login").hidden = true;
  el("dashboard").hidden = false;

  el("welkom").textContent =
    "Welkom, " +
    (profiel.naam || "medewerker");

  el("rol").textContent =
    "Je bent ingelogd als " + profiel.rol;

  el("planner").hidden =
    profiel.rol !== "planner";

  el("werknemer").hidden =
    profiel.rol !== "medewerker";

  if (profiel.rol !== "planner") return;

  const { data: medewerkers, error: fout } =
    await db
      .from("profielen")
      .select("id,naam")
      .order("naam");

  if (fout) throw fout;

  namen = {};
  el("medewerker").replaceChildren();

  for (const m of medewerkers) {
    namen[m.id] = m.naam || "Medewerker";

    const optie =
      document.createElement("option");

    optie.value = m.id;
    optie.textContent = namen[m.id];

    el("medewerker").appendChild(optie);
  }

  await laadWeek();
}

el("datum").value =
  datumTekst(new Date());

el("datum").addEventListener(
  "change",
  () => laadWeek().catch(
    e => bericht(e.message)
  )
);

el("loginForm").onsubmit = async e => {
  e.preventDefault();

  const knop =
    e.target.querySelector("button");

  knop.disabled = true;
  el("loginMelding").textContent = "";

  try {
    const { error } =
      await db.auth.signInWithPassword({
        email: el("email").value,
        password: el("password").value
      });

    if (error) throw error;

    await toonDashboard();
  } catch (err) {
    el("loginMelding").textContent =
      "Inloggen mislukt: " + err.message;
  } finally {
    knop.disabled = false;
  }
};

el("maakWeek").onclick = async () => {
  const { error } = await db
    .from("roosterweken")
    .insert({
      week_start:
        maandag(el("datum").value),
      status: "concept"
    });

  if (error) {
    bericht(error.message);
  } else {
    await laadWeek();
  }
};

el("dienstForm").onsubmit = async e => {
  e.preventDefault();

  if (!weekId) return;

  const dag = el("werkdag").value;
  const week = maandag(el("datum").value);

  if (
    dag < week ||
    dag > verschuif(week, 6)
  ) {
    bericht("Kies een datum binnen deze week.");
    return;
  }

  const start = new Date(
    dag + "T" + el("begin").value
  );

  const eind = new Date(
    dag + "T" + el("eind").value
  );

  if (eind <= start) {
    bericht("Controleer de werktijden.");
    return;
  }

  const { error } = await db
    .from("diensten")
    .insert({
      medewerker_id:
        el("medewerker").value,

      roosterweek_id: weekId,

      begint_op:
        start.toISOString(),

      eindigt_op:
        eind.toISOString(),

      pauze_minuten:
        Number(el("pauze").value)
    });

  if (error) {
    bericht(error.message);
  } else {
    await laadWeek();
  }
};

el("logout").onclick = async () => {
  await db.auth.signOut();
  el("password").value = "";
  await toonDashboard();
};

toonDashboard().catch(err => {
  el("login").hidden = false;
  el("dashboard").hidden = true;
  el("planner").hidden = true;
  el("werknemer").hidden = true;
  el("loginMelding").textContent =
    "Fout: " + err.message;
});
</script>

</body>
</html>
