<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnzeParkenRooster</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f3f7fb;
  margin: 0;
  padding: 20px;
  color: #253238;
}

h1 {
  color: #167b65;
  text-align: center;
  font-size: 30px;
}

.subtitle { text-align: center; }

.kaart {
  background: white;
  padding: 24px;
  border-radius: 16px;
  max-width: 600px;
  margin: 20px auto;
  box-shadow: 0 3px 15px #00000010;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
}

input, select {
  border: 1px solid #ccc;
  background: white;
}

button {
  background: #167b65;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled { opacity: 0.5; }

button.secundair {
  background: #e8edf0;
  color: #253238;
}

button.verwijderen {
  background: #b73535;
}

button.publiceren {
  background: #167b65;
  font-weight: bold;
  margin-top: 16px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}

.dienst {
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
  line-height: 1.6;
}

.dienstknoppen {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.dienstknoppen button {
  flex: 1;
  padding: 10px;
  font-size: 14px;
}

.status {
  background: #edf5f0;
  padding: 12px;
  border-radius: 8px;
}

#melding, #loginMelding {
  color: #a33524;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #777;
  margin: 40px auto 20px;
  font-size: 13px;
}

[hidden] { display: none !important; }
</style>
</head>

<body>

<h1>🎡 Onze FamilieParken</h1>
<p class="subtitle">Personeelsplanning</p>

<section class="kaart" id="login">
  <h2>Inloggen</h2>
  <form id="loginForm">
    <input id="email" type="email"
      placeholder="E-mailadres"
      autocomplete="username" required>
    <input id="password" type="password"
      placeholder="Wachtwoord"
      autocomplete="current-password" required>
    <button type="submit">Inloggen</button>
  </form>
  <p id="loginMelding" role="status"></p>
</section>

<section class="kaart" id="dashboard" hidden>
  <h2 id="welkom">Welkom</h2>
  <p id="rol"></p>
  <button id="logout">Uitloggen</button>
</section>

<section class="kaart" id="planner" hidden>
  <h2>📅 Weekrooster</h2>

  <label>Kies een week</label>
  <input type="date" id="datum">
  <h3 id="weekTitel"></h3>
  <p class="status" id="status"></p>

  <button id="maakWeek" hidden>
    Conceptweek aanmaken
  </button>

  <div id="formulier" hidden>
    <h3 id="formulierTitel">
      Nieuwe dienst toevoegen
    </h3>
    <form id="dienstForm">
      <label>Medewerker</label>
      <select id="medewerker" required></select>

      <label>Datum</label>
      <input type="date" id="werkdag" required>

      <label>Begintijd</label>
      <input type="time" id="begin"
        value="09:00" required>

      <label>Eindtijd</label>
      <input type="time" id="eind"
        value="17:00" required>

      <label>Pauze (minuten)</label>
      <input type="number" id="pauze"
        value="30" min="0" required>

      <button type="submit" id="opslaan">
        Dienst toevoegen
      </button>
      <button type="button" id="annuleren"
        class="secundair" hidden>
        Wijziging annuleren
      </button>
    </form>
  </div>

  <h3>Ingeplande diensten</h3>
  <div id="diensten"></div>

  <button id="publiceerWeek"
    class="publiceren" hidden>
    📢 Weekrooster publiceren
  </button>

  <p id="publicatieInfo"></p>
  <p id="melding" role="status"></p>
</section>

<section class="kaart" id="werknemer" hidden>
  <h2>Mijn rooster</h2>
  <p>Hier verschijnen later je eigen
     gepubliceerde diensten.</p>
</section>

<footer>Versie 1.2.2</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL =
  "https://tvghmaltprpseimlzcbi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M3FAfJg4lb4D6wVvVsrL-g_iAxB80nI";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

let weekId = null;
let weekStatus = null;
let bewerkId = null;
let namen = {};
let huidigeDiensten = [];

function datumTekst(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2,"0") +
    "-" + String(d.getDate()).padStart(2,"0");
}

function verschuif(datum, dagen) {
  const d = new Date(datum + "T12:00:00");
  d.setDate(d.getDate() + dagen);
  return datumTekst(d);
}

function maandag(datum) {
  const d = new Date(datum + "T12:00:00");
  d.setDate(d.getDate() -
    ((d.getDay() + 6) % 7));
  return datumTekst(d);
}

function lokaleDatum(d) {
  return datumTekst(new Date(d));
}

function lokaleTijd(d) {
  return new Date(d).toLocaleTimeString(
    "nl-NL", {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function bericht(tekst) {
  el("melding").textContent = tekst;
}

function resetFormulier() {
  bewerkId = null;
  el("dienstForm").reset();
  el("begin").value = "09:00";
  el("eind").value = "17:00";
  el("pauze").value = "30";

  if (el("datum").value) {
    el("werkdag").value =
      maandag(el("datum").value);
  }

  el("formulierTitel").textContent =
    "Nieuwe dienst toevoegen";

  el("opslaan").textContent =
    "Dienst toevoegen";

  el("annuleren").hidden = true;
}

async function controleerConcept() {
  if (!weekId) {
    throw new Error("Geen roosterweek geselecteerd.");
  }

  const {data, error} = await db
    .from("roosterweken")
    .select("status")
    .eq("id", weekId)
    .single();

  if (error) throw error;

  if (data.status !== "concept") {
    await laadWeek();
    throw new Error(
      "Deze week is niet meer in concept."
    );
  }
}

async function laadWeek() {
  weekId = null;
  weekStatus = null;
  huidigeDiensten = [];

  resetFormulier();

  el("formulier").hidden = true;
  el("maakWeek").hidden = true;
  el("publiceerWeek").hidden = true;
  el("publicatieInfo").textContent = "";
  el("diensten").replaceChildren();
  bericht("");

  const start = maandag(el("datum").value);
  const einde = verschuif(start, 6);

  el("weekTitel").textContent =
    start + " t/m " + einde;

  el("werkdag").min = start;
  el("werkdag").max = einde;
  el("werkdag").value = start;

  const {data, error} = await db
    .from("roosterweken")
    .select("id,status,gepubliceerd_op")
    .eq("week_start", start)
    .maybeSingle();

  if (error) {
    bericht(error.message);
    return;
  }

  if (!data) {
    el("status").textContent =
      "Nog geen roosterweek aangemaakt.";
    el("maakWeek").hidden = false;
    return;
  }

  weekId = data.id;
  weekStatus = data.status;

  el("status").textContent =
    "Status: " + weekStatus;

  el("formulier").hidden =
    weekStatus !== "concept";

  if (weekStatus === "gepubliceerd") {
    const tijd = data.gepubliceerd_op
      ? new Date(data.gepubliceerd_op)
          .toLocaleString("nl-NL")
      : "Onbekend";

    el("publicatieInfo").textContent =
      "✅ Gepubliceerd op " + tijd +
      ". Dit rooster is vergrendeld.";
  }

  const resultaat = await db
    .from("diensten")
    .select(
      "id,medewerker_id,begint_op,eindigt_op,pauze_minuten"
    )
    .eq("roosterweek_id", weekId)
    .order("begint_op");

  if (resultaat.error) {
    bericht(resultaat.error.message);
    return;
  }

  huidigeDiensten = resultaat.data;

  if (!huidigeDiensten.length) {
    el("diensten").textContent =
      "Nog geen diensten ingepland.";
    return;
  }

  if (weekStatus === "concept") {
    el("publiceerWeek").hidden = false;
  }

  for (const dienst of huidigeDiensten) {
    const regel = document.createElement("div");
    regel.className = "dienst";

    const naam = document.createElement("strong");
    naam.textContent =
      namen[dienst.medewerker_id] || "Medewerker";

    const informatie = document.createElement("p");
    informatie.textContent =
      lokaleDatum(dienst.begint_op) +
      " | " + lokaleTijd(dienst.begint_op) +
      " - " + lokaleTijd(dienst.eindigt_op) +
      " | Pauze: " +
      dienst.pauze_minuten + " minuten";

    regel.append(naam, informatie);

    if (weekStatus === "concept") {
      const knoppen = document.createElement("div");
      knoppen.className = "dienstknoppen";

      const wijzigen = document.createElement("button");
      wijzigen.textContent = "✏️ Wijzigen";
      wijzigen.className = "secundair";
      wijzigen.onclick = () => wijzigDienst(dienst.id);

      const verwijderen = document.createElement("button");
      verwijderen.textContent = "🗑 Verwijderen";
      verwijderen.className = "verwijderen";
      verwijderen.onclick = () => verwijderDienst(dienst.id);

      knoppen.append(wijzigen, verwijderen);
      regel.appendChild(knoppen);
    }

    el("diensten").appendChild(regel);
  }
}

function wijzigDienst(id) {
  const dienst =
    huidigeDiensten.find(d => d.id === id);

  if (!dienst || weekStatus !== "concept") return;

  bewerkId = id;

  el("medewerker").value = dienst.medewerker_id;
  el("werkdag").value =
    lokaleDatum(dienst.begint_op);
  el("begin").value =
    lokaleTijd(dienst.begint_op);
  el("eind").value =
    lokaleTijd(dienst.eindigt_op);
  el("pauze").value = dienst.pauze_minuten;

  el("formulierTitel").textContent =
    "Dienst wijzigen";

  el("opslaan").textContent =
    "Wijzigingen opslaan";

  el("annuleren").hidden = false;

  el("formulier").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function verwijderDienst(id) {
  if (weekStatus !== "concept") return;

  if (!confirm(
    "Weet je zeker dat je deze dienst wilt verwijderen?"
  )) return;

  try {
    await controleerConcept();

    const {data, error} = await db
      .from("diensten")
      .delete()
      .eq("id", id)
      .eq("roosterweek_id", weekId)
      .select("id");

    if (error) throw error;

    if (!data.length) {
      throw new Error(
        "Dienst niet verwijderd. Controleer de rechten."
      );
    }

    await laadWeek();
    bericht("Dienst verwijderd.");
  } catch(e) {
    bericht(e.message);
  }
}

async function publiceerWeek() {
  if (!weekId || weekStatus !== "concept") return;

  const akkoord = confirm(
    "Wil je dit weekrooster publiceren?\n\n" +
    "Medewerkers kunnen daarna hun eigen " +
    "diensten bekijken.\n\n" +
    "Je kunt gepubliceerde diensten " +
    "voorlopig niet meer aanpassen.\n\n" +
    "Er worden nog geen e-mails verstuurd."
  );

  if (!akkoord) return;

  const knop = el("publiceerWeek");
  knop.disabled = true;

  try {
    const {data, error} = await db
      .from("roosterweken")
      .update({status:"gepubliceerd"})
      .eq("id", weekId)
      .eq("status", "concept")
      .select("id,status");

    if (error) throw error;

    if (!data || data.length !== 1) {
      throw new Error(
        "Publiceren niet gelukt. " +
        "Vernieuw het rooster en probeer opnieuw."
      );
    }

    await laadWeek();
    bericht("✅ Weekrooster gepubliceerd!");
  } catch(err) {
    bericht(err.message);
  } finally {
    knop.disabled = false;
  }
}

async function toonDashboard() {
  const {data:{user}, error:authError} =
    await db.auth.getUser();

  if (authError || !user) {
    el("login").hidden = false;
    el("dashboard").hidden = true;
    el("planner").hidden = true;
    el("werknemer").hidden = true;
    return;
  }

  const {data:profiel, error} = await db
    .from("profielen")
    .select("naam,rol")
    .eq("id", user.id)
    .single();

  if (error || !profiel) {
    throw new Error("Geen geldig profiel gevonden.");
  }

  el("login").hidden = true;
  el("dashboard").hidden = false;

  el("welkom").textContent =
    "Welkom, " + (profiel.naam || "medewerker");

  el("rol").textContent =
    "Je bent ingelogd als " + profiel.rol;

  el("planner").hidden =
    profiel.rol !== "planner";

  el("werknemer").hidden =
    profiel.rol !== "medewerker";

  if (profiel.rol !== "planner") return;

  const {data:medewerkers, error:fout} = await db
    .from("profielen")
    .select("id,naam")
    .order("naam");

  if (fout) throw fout;

  namen = {};
  el("medewerker").replaceChildren();

  for (const m of medewerkers) {
    namen[m.id] = m.naam || "Medewerker";

    const optie = document.createElement("option");
    optie.value = m.id;
    optie.textContent = namen[m.id];
    el("medewerker").appendChild(optie);
  }

  await laadWeek();
}

el("datum").value = datumTekst(new Date());

el("datum").addEventListener("change", () =>
  laadWeek().catch(e => bericht(e.message))
);

el("loginForm").onsubmit = async e => {
  e.preventDefault();

  const knop = e.target.querySelector("button");
  knop.disabled = true;
  el("loginMelding").textContent = "";

  try {
    const {error} = await db.auth.signInWithPassword({
      email: el("email").value,
      password: el("password").value
    });

    if (error) throw error;
    await toonDashboard();
  } catch(err) {
    el("loginMelding").textContent =
      "Inloggen mislukt: " + err.message;
  } finally {
    knop.disabled = false;
  }
};

el("maakWeek").onclick = async () => {
  const {error} = await db
    .from("roosterweken")
    .insert({
      week_start: maandag(el("datum").value),
      status: "concept"
    });

  if (error) bericht(error.message);
  else await laadWeek();
};

el("annuleren").onclick = resetFormulier;

el("publiceerWeek").onclick = publiceerWeek;

el("dienstForm").onsubmit = async e => {
  e.preventDefault();

  const knop = el("opslaan");
  knop.disabled = true;

  try {
    await controleerConcept();

    const dag = el("werkdag").value;
    const week = maandag(el("datum").value);

    if (dag < week || dag > verschuif(week,6)) {
      throw new Error(
        "Kies een datum binnen deze week."
      );
    }

    const start = new Date(
      dag + "T" + el("begin").value
    );

    const eind = new Date(
      dag + "T" + el("eind").value
    );

    const pauze = Number(el("pauze").value);

    if (
      eind <= start ||
      pauze < 0 ||
      pauze >= (eind - start) / 60000
    ) {
      throw new Error(
        "Controleer de tijden en pauzeduur."
      );
    }

    const gegevens = {
      medewerker_id: el("medewerker").value,
      begint_op: start.toISOString(),
      eindigt_op: eind.toISOString(),
      pauze_minuten: pauze
    };

    let resultaat;

    if (bewerkId !== null) {
      resultaat = await db
        .from("diensten")
        .update(gegevens)
        .eq("id", bewerkId)
        .eq("roosterweek_id", weekId)
        .select("id");
    } else {
      resultaat = await db
        .from("diensten")
        .insert({
          ...gegevens,
          roosterweek_id: weekId
        })
        .select("id");
    }

    if (resultaat.error) throw resultaat.error;

    if (!resultaat.data.length) {
      throw new Error(
        "Opslaan niet gelukt. Controleer de rechten."
      );
    }

    await laadWeek();
    bericht("Dienst succesvol opgeslagen.");
  } catch(err) {
    bericht(err.message);
  } finally {
    knop.disabled = false;
  }
};

el("logout").onclick = async () => {
  await db.auth.signOut();
  el("password").value = "";
  await toonDashboard();
};

toonDashboard().catch(err => {
  el("login").hidden = false;
  el("dashboard").hidden = true;
  el("planner").hidden = true;
  el("werknemer").hidden = true;
  el("loginMelding").textContent =
    "Fout: " + err.message;
});
</script>
</body>
</html>
